data:
  path: "Country-data.csv"
  test_size: 0.2
  random_state: 42

feature_engineering:
  income_weight: 0.3
  life_expec_weight: 0.3
  gdpp_weight: 0.25
  child_mort_weight: 0.15
  development_threshold: 0.6   # top 40% by composite score → is_developed = 1

classification:
  cv_folds: 5

  logistic_regression:
    C: [0.1, 1, 10]
    solver: ["lbfgs", "liblinear"]

  knn:
    n_neighbors: [3, 5, 7, 9]
    weights: ["uniform", "distance"]

  svm:
    C: [0.1, 1, 10]
    kernel: ["rbf", "linear"]

  decision_tree:
    max_depth: [3, 5, 7, null]
    min_samples_split: [2, 5, 10]

  random_forest:
    n_estimators: [100, 200]
    max_depth: [5, 10, null]
    min_samples_split: [2, 5]

  gradient_boosting:
    n_estimators: [100, 200]
    learning_rate: [0.05, 0.1, 0.2]
    max_depth: [3, 5]

  xgboost:
    n_estimators: [100, 200]
    learning_rate: [0.05, 0.1]
    max_depth: [3, 5, 7]

  lightgbm:
    n_estimators: [100, 200]
    learning_rate: [0.05, 0.1]
    num_leaves: [31, 63]

clustering:
  random_state: 42

  kmeans:
    n_clusters: 5
    n_init: 10
    max_iter: 300

  kmedoids:
    n_clusters: 5
    method: "pam"

  dbscan:
    eps: 1.5
    min_samples: 3
    metric: "euclidean"

  hierarchical:
    n_clusters: 5
    linkage: "ward"

output:
  metrics_path: "results/metrics.json"
  plots_dir: "plots/"
